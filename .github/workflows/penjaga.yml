name: Penjaga kantor
# Tiap 30 menit, pukul 07.00–23.30 WIB: lanjutkan task setelah kuota AI pulih + notifikasi Telegram.
on:
  schedule:
    - cron: "*/30 0-16 * * *"
  workflow_dispatch: {}
concurrency: { group: penjaga, cancel-in-progress: false }
jobs:
  jaga:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx -y tsx@4.19.2 --conditions=react-server scripts/penjaga.ts
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          TELEGRAM_BOTS: ${{ secrets.TELEGRAM_BOTS }}
          KANTOR_TIMEZONE: Asia/Jakarta
